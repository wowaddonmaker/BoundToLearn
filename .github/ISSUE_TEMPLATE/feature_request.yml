name: Feature Request
description: Something the addon should do
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        **Quickest way:** in game, click **Give feedback** in the window your idea is about (or type `/btl feedback`). It opens this tracker with the screen's details already filled in.
  - type: dropdown
    id: feature
    attributes:
      label: Which part of the addon?
      options:
        # BEGIN generated: parts (tools/issue_forms.lua, from Feedback.PARTS)
        - "Icon Game (track select, rounds, results)"
        - "Keybind Quiz"
        - "Ping Trainer"
        - "Keybind Audit"
        - "Keybind Tracker"
        - "Click Blocking"
        - "Statistics"
        - "Options"
        - "Other or not sure"
        # END generated: parts
    validations:
      required: true
  - type: dropdown
    id: track
    attributes:
      label: Which track?
      description: Only if the idea is about one track in the Icon Game.
