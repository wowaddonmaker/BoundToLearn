name: Feature Request
description: Something the addon should do
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        **Quickest way:** in game, click **Give feedback** in the window your idea is about (or type `/btl feedback`). It opens this tracker with the screen's details already filled in.
  - type: dropdown
    id: feature
    attributes:
      label: Which part of the addon?
      options:
        - Practice Game (track select, rounds, results)
        - Keybind Quiz
        - Ping Trainer
        - Keybind Audit
        - Keybind Tracker
        - Click Blocking
        - Statistics
        - Options
        - Something new
    validations:
      required: true
  - type: textarea
    id: request
    attributes:
      label: What would you like?
      description: What it should do and what it would be for. A screenshot or mockup helps.
    validations:
      required: true
