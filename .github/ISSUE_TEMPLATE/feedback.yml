name: Feedback from the addon
description: Sent from the Give feedback button in BoundToLearn. Something broken, an idea, anything.
labels: ["feedback"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. The **Details from the addon** box at the bottom was filled in by the addon: its version, your game client and the screen you were on. Leave it as it is; you only need to fill in the top part.
  - type: dropdown
    id: kind
    attributes:
      label: What is this about?
      options:
        - Something is broken or looks wrong
        - An idea or a request
        - Something else
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Tell us about it
      description: What you saw and what you expected instead, or what you would like and what it would be for.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to make it happen
      description: Only for a problem. What you clicked or pressed, in order, and whether you were in combat.
      placeholder: |
        1. Open the track select
        2. Pick ...
    validations:
      required: false
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: A screenshot helps more than anything. Drag the image into this box.
    validations:
      required: false
  - type: textarea
    id: errors
    attributes:
      label: Lua errors
      description: |
        If the game showed an error, paste the first one here (the first is the one that matters). To see errors, type `/console scriptErrors 1`, or install BugSack and BugGrabber (both are needed).
      render: text
    validations:
      required: false
  - type: textarea
    id: details
    attributes:
      label: Details from the addon
      description: |
        Filled in by the addon. If this box is empty, type `/btl feedback` in game and open that link instead, or write your addon version and game client (Retail or WoW Forever) here.
      render: text
    validations:
      required: true
