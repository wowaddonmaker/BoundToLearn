name: Feedback from the addon
description: Sent from the Give feedback button in BoundToLearn. Something broken, an idea, anything.
labels: ["feedback"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. The addon picked the part and the track for you and filled in the **Details from the addon** box at the bottom: its version, your game client and the screen you were on. Leave that box as it is; give the issue a title and tell us about it.
  - type: dropdown
    id: kind
    attributes:
      label: What is this about?
      options:
        - Something is broken or looks wrong
        - An idea or a request
        - Something else
    validations:
      required: true
  - type: dropdown
    id: feature
    attributes:
      label: Which part of the addon?
      options:
        # BEGIN generated: parts (tools/issue_forms.lua, from Feedback.PARTS)
        - "Icon Game (track select, rounds, results)"
        - "Keybind Quiz"
        - "Ping Trainer"
        - "Keybind Audit"
        - "Keybind Tracker"
        - "Click Blocking"
        - "Statistics"
        - "Options"
        - "Other or not sure"
        # END generated: parts
    validations:
      required: true
  - type: dropdown
    id: track
    attributes:
      label: Which track?
      description: Only if it is about one track in the Icon Game.
      options:
        # BEGIN generated: tracks (tools/issue_forms.lua, from SongData.IssueTracks)
        - "Aftermath"
        - "Anduin"
        - "Argent Joust"
        - "Ashvane Company"
        - "Assault"
