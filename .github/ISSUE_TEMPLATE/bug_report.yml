name: Bug Report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Quickest way:** in game, click **Give feedback** in the window the problem is in (or type `/btl feedback`). It opens this tracker with your addon version, game client and the screen's details already filled in.
  - type: dropdown
    id: feature
    attributes:
      label: Which part of the addon?
      options:
        # BEGIN generated: parts (tools/issue_forms.lua, from Feedback.PARTS)
        - "Icon Game (track select, rounds, results)"
        - "Keybind Quiz"
        - "Ping Trainer"
        - "Keybind Audit"
        - "Keybind Tracker"
        - "Click Blocking"
        - "Statistics"
        - "Options"
        - "Other or not sure"
        # END generated: parts
    validations:
      required: true
  - type: dropdown
    id: track
    attributes:
      label: Which track?
      description: Only if it happens on one track in the Icon Game.
      options:
        # BEGIN generated: tracks (tools/issue_forms.lua, from SongData.IssueTracks)
        - "Aftermath"
        - "Anduin"
        - "Argent Joust"
        - "Ashvane Company"
        - "Assault"
