name: Bug Report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Addon version
      description: You can find this in your addon list (AddOns button on the character select screen).
      placeholder: "e.g. 1.0.1"
    validations:
      required: false

  - type: dropdown
    id: feature
    attributes:
      label: Which part of the addon?
      options:
        - Keybind Tracker
        - Practice Game (Icon Game)
        - Ping Trainer
        - Keybind Quiz
        - Keybind Audit
        - Click Blocking
        - Options / Settings
        - Other / Not sure
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe what went wrong.
      placeholder: Tell us what you saw.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
      placeholder: Tell us what you expected instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: How can we reproduce it?
      description: What were you doing when it happened?
      placeholder: |
        1. Open the Practice Game
        2. Select a song
        3. ...
    validations:
      required: false

  - type: textarea
    id: error
    attributes:
      label: Error message (if any)
      description: If you saw a Lua error, paste it here. An error-capturing addon can help you grab these.
      render: shell
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots, other addons that might conflict, or any other details.
    validations:
      required: false
