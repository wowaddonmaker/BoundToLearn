name: Bug Report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Quickest way:** in game, click **Give feedback** in the window the problem is in (or type `/btl feedback`). It opens this tracker with your addon version, game client and the screen's details already filled in.
  - type: dropdown
    id: feature
    attributes:
      label: Which part of the addon?
      options:
        - Practice Game (track select, rounds, results)
        - Keybind Quiz
        - Ping Trainer
        - Keybind Audit
        - Keybind Tracker
        - Click Blocking
        - Statistics
        - Options
        - Other / Not sure
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: What happened?
      description: What you saw and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to make it happen
      description: What you clicked or pressed, in order, and whether you were in combat.
      placeholder: |
        1. Open the track select
        2. Pick ...
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Addon details
      description: |
        In game, type `/btl feedback` and open that link instead of this page, or write your addon version and game client (Retail or WoW Forever) here.
      render: text
    validations:
      required: true
  - type: textarea
    id: errors
    attributes:
      label: Lua errors
      description: |
        If the game showed an error, paste the first one here (the first is the one that matters). To see errors, type `/console scriptErrors 1`, or install BugSack and BugGrabber (both are needed).
      render: text
    validations:
      required: false
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: A screenshot helps more than anything. Drag the image into this box.
    validations:
      required: false
  - type: dropdown
    id: alone
    attributes:
      label: Does it still happen with only BoundToLearn turned on?
      description: Turn everything else off in the addon list, restart the interface and try once more. Another addon touching the same thing is the most common cause of a problem nobody else can reproduce.
      options:
        - "Yes, it still happens with only this addon on"
        - "No, it goes away with the rest turned off (say which one above if you found it)"
        - "I have no other addons"
        - "I did not try"
    validations:
      required: true
