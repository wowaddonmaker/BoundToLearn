name: Label feedback

# An issue form cannot pick its label from an answer, so this reads the
# feedback form's "What is this about?" answer when the issue opens and
# labels it. The answers below must match the options of the kind dropdown
# in .github/ISSUE_TEMPLATE/feedback.yml (tools/issue_forms.lua --check).

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const LABELS = {
              "Something is broken or looks wrong": "bug",
              "An idea or a request": "enhancement",
              "Something else": "question",
            };
            const body = context.payload.issue.body || "";
            const match = body.match(/### What is this about\?\s*\n+([^\n]+)/);
            const label = match && LABELS[match[1].trim()];
            if (!label) return;
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: [label],
            });
